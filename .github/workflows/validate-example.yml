# Example: Run ALZ validation in GitHub Actions using OIDC (WIF)
# Copy and adapt this workflow to your own repo.
name: ALZ Validation Example

on:
  workflow_dispatch:
    inputs:
      management_group:
        description: Management Group ID to scan
        required: false
      report_format:
        description: Report format (CSV, Markdown, HTML, All)
        default: All
        required: false

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

jobs:
  validate:
    name: ALZ Checklist Validation
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX_PERSONAL || '["self-hosted","linux","x64","personal"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Azure login (OIDC / WIF)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Run ALZ validation
        uses: azure/powershell@f5b8adcfff1904872c7b98d4012d4914d74b1a82 # v3.0.0
        with:
          azPSVersion: latest
          inlineScript: |
            $params = @{
              ReportFormat = '${{ github.event.inputs.report_format || ''All'' }}'
            }
            $mg = '${{ github.event.inputs.management_group }}'
            if ($mg) { $params['ManagementGroup'] = $mg }

            ./Validate-Queries.ps1 @params

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alz-validation-reports
          path: |
            validation_results.csv
            validation_results.md
            validation_results.html
          retention-days: 30